[package]
name = "chkey_updater"
version = "0.1.0"
edition = "2024"

[lib]
name = "chkey_updater"
path = "src/lib.rs"

[[bin]]
name = "chkey_installer"
path = "src/installer.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "default-tls"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "rt", "time"] }
semver = "1"
sha2 = "0.10"
futures-util = "0.3"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }