[package]
name = "chkey_setup"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[lib]
name = "chkey_setup"
path = "src/lib.rs"

[[bin]]
name = "CHKey_Setup"
path = "src/main.rs"

[dependencies]
chrono = "0.4"
sha2 = "0.10"
chkey_config = { path = "../../../config" }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_WindowsAndMessaging",
] }
[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
