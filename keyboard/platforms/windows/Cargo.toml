[package]
name = "chkey_windows"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "CHKey"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
chkey_updater = { path = "../../updater" }
chkey_engine = { path = "../../engine" }
chkey_ui = { path = "../../ui" }
chkey_i18n = { path = "../../i18n" }
chkey_config = { path = "../../config" }
chkey_setup = { path = "setup" }
chkey_tsf = { path = "tsf" }
slint = { version = "1.13", features = ["raw-window-handle-06"] }
raw-window-handle = "0.6"

chrono = "0.4.45"

tray-icon = "0.21"
image = { version = "0.25", default-features = false, features = ["png", "ico"] }
windows-core = "0.58"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }
windows = { version = "0.58", features = [
    "implement",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Com",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_TextServices",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
